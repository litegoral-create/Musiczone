name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version

          echo "JAVA_HOME is set to: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_RAW_VERSION"

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Active Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17." >&2
            exit 1
          fi

          echo "Java environment verified successfully: Version $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        working-directory: android
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Existing debug keystore detected at $KEYSTORE_PATH. Skipping generation."
          else
            echo "Generating temporary debug keystore using Java 17 keytool..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Failed to create or locate debug keystore at $KEYSTORE_PATH." >&2
            exit 1
          fi

          echo "Temporary debug keystore verified at $KEYSTORE_PATH."

      - name: Build debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        working-directory: android
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk directory for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK at $EXPECTED_APK exists but is empty (0 bytes)." >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: Expected APK file does not have .apk extension." >&2
            exit 1
          fi

          echo "Successfully verified target debug APK: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        working-directory: android
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TMP_RELEASE_DIR"

          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g')

          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi

          RELEASE_FILENAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$SOURCE_APK" "$TARGET_ASSET_PATH"

          if [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $TARGET_ASSET_PATH." >&2
            exit 1
          fi

          echo "Prepared APK release asset: $TARGET_ASSET_PATH"
          echo "asset_path=${TARGET_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset at $ASSET_PATH does not exist or is empty." >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automatically Generated Debug APK

          * **Source:** Built automatically by GitHub Actions
          * **Run Number:** ${GITHUB_RUN_NUMBER}
          * **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          * **Commit SHA:** \`${GITHUB_SHA}\`
          * **Asset Name:** \`${ASSET_NAME}\`

          > **Notice:** This APK is an automatically generated debug build intended exclusively for testing and validation. It is not an official production or Play Store release and has been signed with the temporary debug keystore used in the CI workflow.
          EOF
          )

          echo "Publishing release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================================="
            echo "  GITHUB RELEASE PUBLISHED SUCCESSFULLY"
            echo "=========================================================="

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "The APK is directly downloadable under the release Assets section."
            echo "Backup Actions artifact 'app-debug-apk' is also preserved."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          * **Release Title:** ${RELEASE_TITLE}
          * **Release Tag:** \`${RELEASE_TAG}\`
          * **APK Filename:** \`${ASSET_NAME}\`
          * **Direct Release Link:** [${RELEASE_URL}](${RELEASE_URL})

          📱 **How to download:** Open the release link above on your phone or desktop, expand the **Assets** section, and click on \`${ASSET_NAME}\`.

          📦 *Note: The standard GitHub Actions artifact \`app-debug-apk\` is also preserved as a backup.*
          EOF

          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, the APK build succeeded!"
            echo "The debug APK artifact 'app-debug-apk' was successfully uploaded and remains available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ APK Build Succeeded (Release Publishing Warning)

          * **APK Build:** ✅ Successfully generated \`app-debug-apk\`
          * **GitHub Release:** ⚠️ Publishing encountered an issue or permission limit.
          * **Download Backup:** The debug APK has been preserved as a GitHub Actions artifact. Download \`app-debug-apk\` directly from this workflow run summary page under **Artifacts**.
          EOF
          fi
